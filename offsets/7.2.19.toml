rekordbox_version = "7.2.19"
platform = "windows"
position_format = "i32"
position_rate_hz = 0.0
decks = []
provenance = "onset calibrate at unix 1790311719"

[signature]
# Five objects share this layout on 7.2.19 (four decks and a player); in address order
# the playing deck can be the fifth.
max_decks = 8

[[signature.anchors]]
offset = -420
module_offset = 92203208

[[signature.anchors]]
offset = -412
module_offset = 92203720

[[signature.anchors]]
offset = -364
module_offset = 92203640

[[signature.anchors]]
offset = -356
module_offset = 92203152

[[signature.anchors]]
offset = -348
module_offset = 92203320

[[signature.anchors]]
offset = -300
module_offset = 92203168

[[signature.anchors]]
offset = -340
module_offset = 92203160

[[signature.anchors]]
offset = -36
module_offset = 92088496

[signature.master_flag]
# Found with `onset-cli memflag`: 1 on the MASTER deck, 0 on the others.
offset = -396
mask = 1

[signature.master_chains]
# rekordbox's MASTER button, one byte per deck in an array static memory leads to: deck N's
# byte is [[rekordbox.exe + root] + hop] + 0x1b8 + (N - 1) * 0x370, 1 on the MASTER deck.
# Found on 2026-10-22 by scanning the heap through five MASTER presses, then watching
# through a deck restart, a track load and four more presses: these bytes matched the lit
# button every time, while the deck objects' byte (`master_flag`, used when this is absent)
# stopped following a deck after it restarted or loaded a track. Four static routes reach
# the array; the first that resolves is read.
stride = 880
decks = 4
mask = 1

[[signature.master_chains.chains]]
# rekordbox.exe+0x6031e98 -> +0x1450 -> +0x1b8
root = 100867736
hops = [5200, 440]

[[signature.master_chains.chains]]
# rekordbox.exe+0x6156c00 -> +0x17e0 -> +0x1b8
root = 102067200
hops = [6112, 440]

[[signature.master_chains.chains]]
# rekordbox.exe+0x6048b28 -> +0x1b80 -> +0x1b8
root = 100961064
hops = [7040, 440]

[[signature.master_chains.chains]]
# rekordbox.exe+0x6113db8 -> +0x1ca0 -> +0x1b8
root = 101793208
hops = [7328, 440]

[signature.tempo]
# The deck's tempo (f32 BPM) and pitch (f32 fraction) beside the position: Lady Hear Me
# Tonight (126.02) synced to 125.00 read 125.0 and -0.00833.
bpm_offset = -4
pitch_offset = 4

[signature.track_id]
# rekordbox's player objects: each holds the playhead of the deck it plays and leads to the
# loaded track's content id (djmdContent.ID) at [[pos - 0x78] + 0x38] + 0x110. They carry
# module+0x57fe968 at pos - 200. Seen with Miami 2 Ibiza (157452017) at 355.25 s on deck 1
# and Lady Hear Me Tonight (195752842) on deck 2, and earlier with Stop It (126351799).
anchor_module_offset = 92268904
anchor_offset = -200
chain = [-120, 56, 272]
