[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "onset-service"
version = "0.2.0"
description = "Evidence-backed DJ preparation, cue review and transition planning"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.14.1", "soundfile==0.13.1", "librosa==0.11.0", "psutil==7.0.0", "mutagen==1.47.0"]

[project.optional-dependencies]
rekordbox = ["pyrekordbox==0.4.4"]
test = ["pytest==8.3.5"]

[project.scripts]
onset-service = "onset_service.cli:main"

[tool.setuptools]
packages = ["onset_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
