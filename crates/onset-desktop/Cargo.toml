[package]
name = "onset-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
authors.workspace = true
description = "OnSet desktop: Autocue's preparation screens and the live view in one Tauri app"

[[bin]]
name = "onset-desktop"
path = "src/main.rs"

[features]
# Serve the built screens (autocue/dist) from inside the binary. Without it, the webview
# loads the Vite dev server at http://127.0.0.1:5173 instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
onset-core.workspace = true
onset-engine.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
parking_lot.workspace = true
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync"] }
rfd = "0.15"
open = "5"
ureq.workspace = true
sha2.workspace = true
base64 = "0.22"
getrandom = "0.2"
jsonwebtoken = "9"
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
